name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          import time
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          IGNORAR = [".git*", ".github*", "*.ipynb", "__pycache__*"]

          def subir(sin_readme: bool) -> None:
              api.upload_folder(
                  folder_path=".",
                  repo_id=os.environ["HF_SPACE_ID"],
                  repo_type="space",
                  commit_message="Sync desde GitHub Actions",
                  ignore_patterns=IGNORAR + (["README.md"] if sin_readme else []),
              )

          for intento in range(1, 4):
              try:
                  subir(sin_readme=False)
                  print("Space sincronizado")
                  break
              except Exception as exc:
                  print(f"Intento {intento} falló ({type(exc).__name__}: {exc})")
                  if intento == 3:
                      # El endpoint de validación YAML del README a veces responde
                      # corrupto desde los runners; el README solo cambia rara vez,
                      # así que sincronizamos el resto y dejamos el README como está.
                      print("Sincronizando sin README.md (la validación YAML del Hub falla)...")
                      subir(sin_readme=True)
                      print("Space sincronizado (sin README.md)")
                  else:
                      time.sleep(20 * intento)
          EOF
