name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          pip install -q huggingface_hub
          python - <<'EOF'
          import os
          import time
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          for intento in range(1, 4):
              try:
                  api.upload_folder(
                      folder_path=".",
                      repo_id=os.environ["HF_SPACE_ID"],
                      repo_type="space",
                      commit_message="Sync desde GitHub Actions",
                      ignore_patterns=[".git*", ".github*", "*.ipynb", "__pycache__*"],
                  )
                  print("Space sincronizado")
                  break
              except Exception as exc:
                  # La API del Hub a veces responde errores transitorios (no-JSON/5xx)
                  if intento == 3:
                      raise
                  print(f"Intento {intento} falló ({type(exc).__name__}: {exc}); reintentando...")
                  time.sleep(20 * intento)
          EOF
